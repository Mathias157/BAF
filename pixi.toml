[workspace]
channels = ["conda-forge", "bioconda"]
name = "BAF"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
generate-mappings = "cd src && python Pre-Processing/preprocessing.py generate-mappings"
generate-antares-vre = "cd src && pixi run python Pre-Processing/preprocessing.py generate-antares-vre"
generate-balmorel-timeseries = "cd src && pixi run python Pre-Processing/preprocessing.py generate-balmorel-timeseries"
generate-balmorel-hydro = "cd src && python Pre-Processing/preprocessing.py generate-balmorel-hydro"
generate-balmorel-heat-series = "cd src && python Pre-Processing/preprocessing.py generate-balmorel-heat-series"
preprocessing = "cd src && snakemake -s Jobs/preprocessing.smk"
initialisation = "cd src && python -m Workflow.Initialisation" 
periprocess = "cd src && python Workflow/PeriProcessing.py" 
postprocess = "cd src && python Workflow/PostProcessing.py" 
space-aggregate-balmorel = "cd src && python Pre-Processing/spatial_aggregation.py"
analyse = "cd src/Balmorel && python analysis/analyse.py "
temporal-agg = "cd src && python Workflow/TimeseriesAggregation.py"
genmodelinput = "cd src && python Workflow/Functions/export_data_to_generative_model.py"
all-genmodelinput = "cd src && python Workflow/Functions/export_data_to_generative_model.py base -f"
sync-down = { cmd = "rsync -avzu --filter=':- .gitignore' mberos@login2.hpc.dtu.dk:/work3/mberos/BAF/ . && rsync -avzu --filter=':- .gitignore' mberos@login2.hpc.dtu.dk:'/work3/mberos/BAF/src/Balmorel/base/data/*' ./src/Balmorel/base/data/", description = "Syncs repository to local, including .git folder, but without gitignored files" }
sync-up = { cmd = "rsync -avzu --filter=':- .gitignore'  . mberos@login2.hpc.dtu.dk:/work3/mberos/BAF && rsync -avzu --filter=':- .gitignore'  ./src/Balmorel/base/data/* mberos@login2.hpc.dtu.dk:/work3/mberos/BAF/src/Balmorel/base/data/", description = "Syncs repository to remote, including .git folder, but without gitignored files" }

[target.win.tasks]
r = "cmd /c %USERPROFILE%\\AppData\\Local\\Programs\\R\\R-4.2.3\\bin\\x64\\R"
balmorel = "cd src/Balmorel/base/model && cmd /c C:\\GAMS\\47\\gams Balmorel"
antares = "cd src && 'C:\\Program Files\\RTE\\Antares\\8.7.0\\bin\\antares-8.7-solver' Antares -n"
zip-data = "cd src && Jobs/zip_data.bat"

[target.linux.tasks]
balmorel = "cd src/Balmorel/base/model && gams Balmorel --scenario_name"
antares = "cd src && antares-8.7-solver Antares -n"
zip-data = "cd src && Jobs/zip_data.sh"

[dependencies]
python = "==3.12.9"
snakemake-minimal = ">=9.1.7,<10"
matplotlib = ">=3.10.0"
pandas = ">=2.2.3"
openpyxl = ">=3.1.5"
geopandas = ">=1.0.1"
scipy = ">=1.15.2"
plotly = ">=6.0.0"
click = ">=8.1.8"
numpy = ">=2.2.3"
tsam = ">=2.3.6"
pytest = ">=8.4.0,<9"

[pypi-dependencies]
rpy2 = "==3.5.11"
pybalmorel = ">=1.1.7, <2"
ipython = ">=9.1.0, <10"
ptyprocess = ">=0.7.0, <0.8"
ipykernel = ">=6.29.5, <7"
pyzmq = ">=26.4.0, <27"
premailer = ">=3.10.0, <4"
gamsapi = { version = "==47.6.0", extras = ["transfer"] }
scikit-learn = "*"
torch = ">=2.8.0, <3"
python-decouple = ">=3.8, <4"
